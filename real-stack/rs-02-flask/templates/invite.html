{% extends "base.html" %}
{% block title %}Invite a teammate{% endblock %}
{% block content %}
<h1>Invite a teammate</h1>
<p class="muted">They will get an account with the temporary password <code>Welcome!123</code>. Only workspace admins should hand out the admin role.</p>
{% if msg %}<p class="ok">{{ msg }}</p>{% endif %}
<form method="post" class="form">
<label>Email<input name="email" type="email" required></label>
<label>Role<select name="role"><option value="user">User</option><option value="admin">Admin</option></select></label>
<button>Send invite</button>
</form>
{% endblock %}
