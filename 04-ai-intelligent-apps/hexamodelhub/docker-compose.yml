# HexaModelHub vulnerable practice lab — INTENTIONALLY INSECURE.
# Local training only. The port is bound to 127.0.0.1 on the host;
# never change this to a public interface and never deploy publicly.
services:
  hexamodelhub:
    build: .
    container_name: hexamodelhub-lab
    ports:
      - "127.0.0.1:3049:3049"
    environment:
      - HOST=0.0.0.0
      - PORT=3049
    restart: "no"
