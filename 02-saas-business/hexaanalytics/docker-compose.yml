# HexaAnalytics vulnerable practice lab — INTENTIONALLY INSECURE.
# Local training only. The port is bound to 127.0.0.1 on the host;
# never change this to a public interface and never deploy publicly.
services:
  hexaanalytics:
    build: .
    container_name: hexaanalytics-lab
    ports:
      - "127.0.0.1:3025:3025"
    environment:
      - HOST=0.0.0.0
      - PORT=3025
    restart: "no"
